<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Marty's AI Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#1D9E75;--teal-l:#E1F5EE;--teal-d:#085041;
  --purple:#7F77DD;--purple-l:#EEEDFE;--purple-d:#26215C;
  --coral:#D85A30;--coral-l:#FAECE7;--coral-d:#4A1B0C;
  --amber:#BA7517;--amber-l:#FAEEDA;--amber-d:#633806;
  --blue:#185FA5;--blue-l:#E6F1FB;--blue-d:#042C53;
  --green:#3B6D11;--green-l:#EAF3DE;--green-d:#173404;
  --pink:#D4537E;--pink-l:#FBEAF0;--pink-d:#4B1528;
  --bg:#F5F3EE;--white:#fff;--text:#1a1a1a;--muted:#666;
  --r:16px;--rs:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* LOCK */
#lock{position:fixed;inset:0;z-index:999;background:linear-gradient(155deg,#d4f0e5,#e8f7f1,#f0faf6);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center}
.lock-robot{font-size:72px;animation:bob 2.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.lock-title{font-family:'Fredoka One',cursive;font-size:34px;color:var(--teal-d);margin:10px 0 4px}
.lock-sub{font-size:15px;font-weight:700;color:var(--teal);margin-bottom:28px}
.lock-card{background:white;border-radius:var(--r);padding:24px 28px;width:100%;max-width:320px;border:2px dashed var(--teal)}
.lock-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--teal);margin-bottom:10px}
.lock-card input{width:100%;padding:12px 16px;border-radius:var(--rs);border:2px solid #d0ede3;font-family:'Nunito',sans-serif;font-size:20px;font-weight:800;text-align:center;letter-spacing:4px;outline:none;color:var(--teal-d);background:var(--teal-l);margin-bottom:12px;transition:border-color .2s}
.lock-card input:focus{border-color:var(--teal)}
.lock-card button{width:100%;padding:13px;background:var(--teal);color:white;border:none;border-radius:var(--rs);font-family:'Fredoka One',cursive;font-size:18px;cursor:pointer;letter-spacing:.5px;transition:opacity .15s,transform .1s}
.lock-card button:active{transform:scale(.97);opacity:.9}
.lock-err{font-size:13px;font-weight:800;color:var(--coral);margin-top:10px;min-height:18px;opacity:0;transition:opacity .2s}
.lock-err.show{opacity:1}

/* MAIN */
#main{display:none;padding-bottom:40px}

/* HEADER */
.header{background:linear-gradient(155deg,#d4f0e5,#e8f7f1,#f0faf6);padding:36px 20px 28px;text-align:center;position:relative;overflow:hidden}
.header::before{content:'🤖';font-size:160px;position:absolute;top:-20px;right:-20px;opacity:.06;transform:rotate(12deg);pointer-events:none}
.header-badge{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:2px;color:var(--teal);background:rgba(255,255,255,.75);padding:4px 16px;border-radius:20px;margin-bottom:12px;border:1px solid #b2e8d4}
.header-robot{font-size:56px;animation:bob 2.5s ease-in-out infinite;margin-bottom:8px}
.header-title{font-family:'Fredoka One',cursive;font-size:36px;color:var(--teal-d);line-height:1.1;margin-bottom:4px}
.header-sub{font-size:14px;font-weight:700;color:var(--teal);margin-bottom:18px}
.progress-wrap{background:rgba(255,255,255,.6);border-radius:30px;padding:10px 18px;display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(29,158,117,.2)}
.progress-label{font-size:12px;font-weight:800;color:var(--teal-d)}
.progress-bar-bg{width:120px;height:8px;background:rgba(29,158,117,.2);border-radius:10px;overflow:hidden}
.progress-bar{height:100%;background:var(--teal);border-radius:10px;transition:width .5s ease}
.progress-pct{font-size:12px;font-weight:800;color:var(--teal)}

/* SECTION */
.section-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);padding:20px 20px 10px}

/* WEEK CARDS */
.cards{display:flex;flex-direction:column;gap:12px;padding:0 14px}
.week-card{background:white;border-radius:var(--r);border:1.5px solid #ebebeb;overflow:hidden;transition:transform .15s,border-color .15s;cursor:pointer;text-decoration:none;display:block}
.week-card:active{transform:scale(.98)}
.week-card.locked-card{opacity:.6;cursor:default}
.week-card.done{border-color:#9FE1CB}
.card-top{display:flex;align-items:center;gap:14px;padding:16px 16px 14px}
.card-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.card-info{flex:1;min-width:0}
.card-week{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.card-title{font-family:'Fredoka One',cursive;font-size:18px;color:var(--text);line-height:1.2;margin-bottom:2px}
.card-sub{font-size:12px;font-weight:700;color:var(--muted);line-height:1.4}
.card-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.card-status{font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px}
.card-status.available{background:var(--teal-l);color:var(--teal-d)}
.card-status.coming{background:#f0efe8;color:#999}
.card-status.done-badge{background:#9FE1CB;color:var(--teal-d)}
.card-chapters{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:80px}
.ch-pip{width:7px;height:7px;border-radius:50%;background:#e8e8e0}
.ch-pip.done{background:var(--teal)}
.card-bottom{padding:0 16px 14px 82px}
.card-desc{font-size:12.5px;font-weight:700;color:var(--muted);line-height:1.5}

/* STATS ROW */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:0 14px 4px}
.stat-card{background:white;border-radius:var(--rs);padding:14px 12px;text-align:center;border:1px solid #ebebeb}
.stat-num{font-family:'Fredoka One',cursive;font-size:24px;margin-bottom:2px}
.stat-lbl{font-size:11px;font-weight:700;color:var(--muted);line-height:1.3}

/* QUOTE */
.quote-card{margin:16px 14px 4px;background:var(--purple-l);border-radius:var(--r);padding:14px 18px;display:flex;gap:10px;align-items:flex-start}
.quote-icon{font-size:22px;flex-shrink:0}
.quote-text{font-size:13px;font-weight:700;color:var(--purple-d);line-height:1.55}

/* LOGOUT */
.logout-btn{display:block;margin:24px 14px 0;padding:12px;background:white;border:1.5px solid #ebebeb;border-radius:var(--rs);font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;color:var(--muted);text-align:center;cursor:pointer;width:calc(100% - 28px)}
.logout-btn:active{background:var(--bg)}
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lock">
  <div class="lock-robot">🤖</div>
  <div class="lock-title">Marty's AI Library</div>
  <div class="lock-sub">Enter your secret password!</div>
  <div class="lock-card">
    <div class="lock-label">🔑 Secret Password</div>
    <input type="password" id="pw" placeholder="••••••••" maxlength="20" onkeydown="if(event.key==='Enter')unlock()"/>
    <button onclick="unlock()">Open My Library 🚀</button>
    <div class="lock-err" id="pw-err">Oops! Wrong password. Try again! 🤔</div>
  </div>
</div>

<!-- MAIN LIBRARY -->
<div id="main">

  <div class="header">
    <div class="header-badge">Summer AI Adventure · 8 Weeks</div>
    <div class="header-robot">🤖</div>
    <div class="header-title">Marty's AI Library</div>
    <div class="header-sub">Tap a book to start reading!</div>
    <div class="progress-wrap">
      <div class="progress-label">Progress</div>
      <div class="progress-bar-bg"><div class="progress-bar" id="prog-bar" style="width:0%"></div></div>
      <div class="progress-pct" id="prog-pct">0 / 8 weeks</div>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card"><div class="stat-num" style="color:var(--teal)" id="s-weeks">0</div><div class="stat-lbl">Weeks complete</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--purple)" id="s-chaps">0</div><div class="stat-lbl">Chapters read</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--amber)" id="s-days">0</div><div class="stat-lbl">Days learning</div></div>
  </div>

  <div class="quote-card">
    <div class="quote-icon">💡</div>
    <div class="quote-text" id="daily-tip">Loading today's tip...</div>
  </div>

  <div class="section-label">Your books</div>
  <div class="cards" id="card-list"></div>

  <button class="logout-btn" onclick="logout()">🔒 Lock my library</button>

</div>

<script>
const weeks = [
  {icon:'🧠',title:'What is AI, Anyway?',sub:'Brains, computers, and what makes AI smart',color:'teal',file:'week1.html',chapters:10,available:true,desc:'Learn what AI is, how it\'s different from your amazing brain, and find AI hiding all around your home!'},
  {icon:'🧩',title:'How AI Learns',sub:'Data, patterns, and machine learning',color:'purple',file:'week2.html',chapters:10,available:true,desc:'Discover how AI learns from millions of examples — just like how you learned to walk and talk!'},
  {icon:'👁️',title:'AI That Sees & Hears',sub:'Computer vision and speech recognition',color:'blue',file:'week3.html',chapters:10,available:true,desc:'Explore how AI can see pictures, recognize your voice, write stories, and even make music!'},
  {icon:'🏗️',title:'How AI is Built',sub:'Code, neural nets, and data centers',color:'amber',file:'week4.html',chapters:10,available:true,desc:'Go inside the machine! Learn about code, algorithms, and the giant computers that power AI.'},
  {icon:'🌍',title:'AI Helps the World',sub:'Doctors, farmers, scientists, and space',color:'green',file:'week5.html',chapters:10,available:true,desc:'See how AI is helping fight diseases, grow food, explore space, and protect our planet!'},
  {icon:'🤔',title:'Is AI Fair & Kind?',sub:'Ethics, fairness, privacy, and deepfakes',color:'coral',file:'week6.html',chapters:10,available:true,desc:'Ask the big questions — when is AI unfair? What\'s real vs. fake? And who makes the rules?'},
  {icon:'🛠️',title:'Build Your Own AI!',sub:'Scratch, Teachable Machine, and more',color:'pink',file:'week7.html',chapters:10,available:true,desc:'Get hands-on! Train a real AI to recognize your drawings, build a chatbot, and make AI art!'},
  {icon:'🚀',title:'The Future of AI',sub:'What\'s coming and your role in it',color:'teal',file:'week8.html',chapters:10,available:true,desc:'Dream big about the future! What will AI look like when you\'re grown up — and how will YOU shape it?'},
];

const tips = [
  'Your brain has 86 BILLION neurons — way more than any computer chip!',
  'AI learns from examples, just like how you learned to talk by hearing lots of words.',
  'The word "Robot" was first used in a play in 1920 — over 100 years ago!',
  'Netflix uses AI to pick shows you might like — it watches what YOU watch!',
  'The first AI chess program beat a chess master in 1997. Humans were shocked!',
  'AI can now create music, art, and stories — but it learned from human creators first.',
  'Your iPad uses AI every time it unlocks with your face — Face ID!',
  'Alan Turing, the father of AI, asked "Can machines think?" way back in 1950.',
];

const colors = {
  teal:{bg:'var(--teal-l)',icon:'#E1F5EE',text:'var(--teal)',dark:'var(--teal-d)'},
  purple:{bg:'var(--purple-l)',icon:'var(--purple-l)',text:'var(--purple)',dark:'var(--purple-d)'},
  blue:{bg:'var(--blue-l)',icon:'var(--blue-l)',text:'var(--blue)',dark:'var(--blue-d)'},
  amber:{bg:'var(--amber-l)',icon:'var(--amber-l)',text:'var(--amber)',dark:'var(--amber-d)'},
  green:{bg:'var(--green-l)',icon:'var(--green-l)',text:'var(--green)',dark:'var(--green-d)'},
  coral:{bg:'var(--coral-l)',icon:'var(--coral-l)',text:'var(--coral)',dark:'var(--coral-d)'},
  pink:{bg:'var(--pink-l)',icon:'var(--pink-l)',text:'var(--pink)',dark:'var(--pink-d)'},
};

function getProgress(){
  return JSON.parse(localStorage.getItem('marty_progress')||'{}');
}

function saveProgress(p){
  localStorage.setItem('marty_progress',JSON.stringify(p));
}

function buildCards(){
  const prog = getProgress();
  const list = document.getElementById('card-list');
  list.innerHTML='';
  let doneWeeks=0, doneChaps=0;

  weeks.forEach((w,i)=>{
    const wKey='week'+(i+1);
    const isDone = prog[wKey+'_done']===true;
    const chapsDone = prog[wKey+'_chaps']||0;
    if(isDone) doneWeeks++;
    doneChaps += chapsDone;

    const c = colors[w.color]||colors.teal;
    const card = document.createElement(w.available?'a':'div');
    if(w.available) card.href=w.file;
    card.className='week-card'+(isDone?' done':'')+((!w.available&&!isDone)?' locked-card':'');

    const pips = Array.from({length:w.chapters},(_,pi)=>
      `<div class="ch-pip ${pi<chapsDone?'done':''}"></div>`
    ).join('');

    const statusLabel = isDone?'<span class="card-status done-badge">✓ Complete!</span>':
      w.available?'<span class="card-status available">Start reading!</span>':
      '<span class="card-status coming">Coming soon</span>';

    card.innerHTML=`
      <div class="card-top">
        <div class="card-icon" style="background:${c.icon}">${w.icon}</div>
        <div class="card-info">
          <div class="card-week" style="color:${c.text}">Week ${i+1}</div>
          <div class="card-title">${w.title}</div>
          <div class="card-sub">${w.sub}</div>
        </div>
        <div class="card-right">
          ${statusLabel}
          <div class="card-chapters">${pips}</div>
        </div>
      </div>
      <div class="card-bottom">
        <div class="card-desc">${w.desc}</div>
      </div>`;
    list.appendChild(card);
  });

  const days = Math.round(doneChaps/2);
  document.getElementById('s-weeks').textContent=doneWeeks;
  document.getElementById('s-chaps').textContent=doneChaps;
  document.getElementById('s-days').textContent=days;
  const pct=Math.round((doneWeeks/8)*100);
  document.getElementById('prog-bar').style.width=pct+'%';
  document.getElementById('prog-pct').textContent=doneWeeks+' / 8 weeks';
}

function setTip(){
  const d = new Date().getDay();
  document.getElementById('daily-tip').textContent='Fun fact: '+tips[d];
}

function unlock(){
  const val=document.getElementById('pw').value;
  const err=document.getElementById('pw-err');
  if(val==='roro@123'){
    sessionStorage.setItem('marty_unlocked','yes');
    document.getElementById('lock').style.display='none';
    document.getElementById('main').style.display='block';
    buildCards();
    setTip();
  } else {
    err.classList.add('show');
    document.getElementById('pw').value='';
    document.getElementById('pw').focus();
    setTimeout(()=>err.classList.remove('show'),2500);
  }
}

function logout(){
  sessionStorage.removeItem('marty_unlocked');
  document.getElementById('main').style.display='none';
  document.getElementById('lock').style.display='flex';
  document.getElementById('pw').value='';
}

document.getElementById('pw').addEventListener('keydown',e=>{
  if(e.key==='Enter') unlock();
});

if(sessionStorage.getItem('marty_unlocked')==='yes'){
  document.getElementById('lock').style.display='none';
  document.getElementById('main').style.display='block';
  buildCards();
  setTip();
}
</script>
</body>
</html>
